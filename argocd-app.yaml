apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: python-app

spec:
  project: default

  source:
    repoURL: https://github.com/CNaveen0101/basic-python-app.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

 syncPolicy:
   automated:
     prune: true
     selfHeal: true
